[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "under-the-radar-mvp"
version = "0.2.0"
description = "Duct and radar-coverage estimates from atmospheric data: NOAA pipeline plus an offline learn-from-your-own-data workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
utr = "utr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
